[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "upinet"
version = "0.1.0"
description = "U-PINet neural network backbone for 3D PEC surface-current prediction"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["torch>=1.13", "numpy>=1.21", "scipy>=1.7"]

[tool.setuptools]
packages = ["upinet"]
